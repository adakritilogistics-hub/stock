<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHI Stock</title>
<link rel="icon" href="PHI_LOGO.png">
<style>
:root{--desk:#d9dde0;--paper:#fbfaf7;--ink:#1d2a33;--muted:#66727a;--line:#dfdcd3;--accent:#1f5f7a}
@media (prefers-color-scheme:dark){:root{--desk:#14191d;--paper:#222a30;--ink:#eef1f3;--muted:#9aa6ad;--line:#38434b;--accent:#6bb7d4}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--desk);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
.box{width:100%;max-width:380px}
h1{margin:0 0 6px;font-size:28px;text-align:center}
.lead{margin:0 0 22px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.list a,.list button{display:block;width:100%;padding:20px 22px;border-radius:12px;background:var(--paper);color:var(--ink);text-decoration:none;text-align:center;
  font:inherit;font-size:20px;font-weight:600;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer}
.list a:active,.list button:active{transform:scale(.98)}
.lnk{background:none;border:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:10px}
.fin{display:block;width:100%;margin-top:22px;padding:14px;border-radius:10px;border:0;background:var(--accent);color:var(--paper);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.card{background:var(--paper);padding:24px;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.18)}
.card label{display:block;margin-bottom:14px;color:var(--muted);font-size:14px;text-align:left}
.card input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--desk);color:var(--ink);font:inherit;font-size:16px}
.card input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;height:50px;text-align:left}
.card input[type=date]::-webkit-date-and-time-value{text-align:left}
.card button+button{margin-top:10px}
.card button.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.sumtxt{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:16px;line-height:1.5;margin:0 0 18px;padding:14px;border-radius:8px;background:var(--desk);border:1px solid var(--line)}
.card button{display:block;width:100%;padding:13px;border:0;border-radius:8px;background:var(--accent);color:var(--paper);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
#gate{text-align:center}
#gate h1{margin-bottom:12px}
#ge{color:#b3402a;font-size:14px;margin:10px 0 0;min-height:18px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="box">
  <form id="gate" class="card">
    <h1>Stock</h1>
    <input id="gp" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
    <button type="submit" style="margin-top:12px">Open</button>
    <p id="ge"></p>
  </form>

  <div id="home" hidden>
    <h1>What do you want to do?</h1>
    <p class="lead">&nbsp;</p>
    <div class="list">
      <button id="h1">Check Stock</button>
      <button id="h2">Update Stock</button>
    </div>
  </div>

  <div id="form" class="card" hidden>
    <button class="lnk" id="f0" type="button" style="background:none;color:var(--accent);width:auto;padding:6px 0">‹ Back</button>
    <h1 style="text-align:left;font-size:22px;margin-bottom:16px">New Dispatch</h1>
    <label>Date<input id="f1" type="date"></label>
    <label>Customer Name<input id="f2" type="text" autocomplete="off"></label>
    <label>Mode<input id="f3" type="text" autocomplete="off"></label>
    <label>Payment<span style="color:gray;font-size:12px;">(Optional)</span><input id="f4" type="number" step="0.01" autocomplete="off"></label>
    <label>Marka<span style="color:gray;font-size:12px;">(Optional)</span><input id="f5" type="text" autocomplete="off" span="optional"></label>
    <button id="f6" type="button">Start</button>
  </div>

  <div id="sum" class="card" hidden>
    <button class="lnk" id="s5" type="button" style="background:none;color:var(--accent);width:auto;padding:6px 0">‹ Back to items</button>
    <h1 style="text-align:left;font-size:22px;margin-bottom:14px">Dispatch summary</h1>
    <pre class="sumtxt" id="s1"></pre>
    <button id="s2" type="button">Copy</button>
    <button id="s3" type="button" class="ghost" hidden>Share</button>
    <button id="s4" type="button" class="ghost">Done</button>
  </div>

  <div id="items" hidden>
    <button class="lnk" id="i0">‹ Back</button>
    <h1 id="i1"></h1>
    <p class="lead" id="i2"></p>
    <div class="list">
      <a href="mats.html" onclick="sessionStorage.setItem('go','1')">Mats</a>
      <a href="runners.html" onclick="sessionStorage.setItem('go','1')">Runners</a>
      <a href="multidesigns.html" onclick="sessionStorage.setItem('go','1')">MultiDesigns</a>
      <a href="rwl.html" onclick="sessionStorage.setItem('go','1')">Rolls, Wallpaper and Lace</a>
    </div>
    <button class="fin" id="i3">Finish dispatch</button>
  </div>
</div>
<script>
(function(){
  var HASH="d350d79a2e8b1aab1652684cfe09fa8a85909512bde545cb2bb364a1296a3830"; // password: phistock
  var $=function(i){return document.getElementById(i)};
  function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
  try{localStorage.removeItem("matpw")}catch(e){}
  // Admin mode: open this page with #admin once to turn on the photo buttons on this device; #noadmin turns them off.
  try{var h=location.hash;if(/admin/.test(h)&&!/noadmin/.test(h))localStorage.setItem("matadmin","1");else if(/noadmin/.test(h))localStorage.removeItem("matadmin")}catch(e){}

  function disp(){try{return JSON.parse(sessionStorage.getItem("disp")||"null")}catch(e){return null}}
  function show(id){["gate","home","form","items","sum"].forEach(function(x){$(x).hidden=x!==id})}
  function items(){
    var d=disp(),upd=sessionStorage.getItem("flow")==="update"&&d;
    $("i1").textContent=upd?d.customer:"Check Stock";
    $("i2").textContent=upd?d.date+" · "+d.mode:"Choose a stock list";
    $("i0").hidden=!!upd;$("i3").hidden=!upd;show("items")}
  function route(){var f=sessionStorage.getItem("flow");if((f==="update"&&disp())||f==="check")items();else show("home")}

  $("h1").onclick=function(){sessionStorage.setItem("flow","check");items()};
  var VERIFY_URL="https://script.google.com/macros/s/AKfycbyxTv6mb0mvqx3zfVnqBZEz1DD7BZe3N5FkXshVkjstgbyxfdlqB6-ZpRo_EqnjQ0n0/exec"; // the PIN is checked against this script
  function openForm(){$("f1").value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);show("form")}
  $("h2").onclick=function(){openForm();};
  $("f0").onclick=function(){show("home")};
  $("f6").onclick=function(){var a=$("f1").value,b=$("f2").value.trim(),c=$("f3").value.trim(),d=$("f4").value,e=$("f5").value;
    if(!a||!b){alert("Please fill the date ad customer name");return}
    sessionStorage.setItem("disp",JSON.stringify({date:a,customer:b,mode:c,payment:d,marka:e}));sessionStorage.setItem("flow","update");
    $("f2").value="";$("f3").value="";$("f4").value="";$("f5").value="";items()};
  $("i0").onclick=function(){sessionStorage.removeItem("flow");show("home")};
  function clearDispatch(){
    sessionStorage.removeItem("disp");sessionStorage.removeItem("flow");sessionStorage.removeItem("ddesc");sessionStorage.removeItem("pin");
    Object.keys(sessionStorage).forEach(function(k){if(k.indexOf("notes_")===0)sessionStorage.removeItem(k)})}
  function fmt(iso){var p=iso.split("-");return p[2]+"-"+p[1]+"-"+p[0]}
  function summaryText(){var d=disp();
  return "Date - "+fmt(d.date)+"\nCustomer Name - "+d.customer+"\nMode - "+d.mode+(d.payment?"\nPayment - "+d.payment:"")+(d.marka?"\nMarka - "+d.marka:"")+"\nDescription - "+(sessionStorage.getItem("ddesc")||"")}
  $("i3").onclick=function(){
    if(!sessionStorage.getItem("ddesc")){
      if(!confirm("No items were saved in this dispatch. Finish anyway?"))return;
      clearDispatch();show("home");return}
    $("s1").textContent=summaryText();$("s2").textContent="Copy";show("sum")};
  $("s5").onclick=items;
  $("s4").onclick=function(){clearDispatch();show("home")};
  $("s3").hidden=!navigator.share;
  $("s3").onclick=function(){navigator.share({text:summaryText()}).catch(function(){})};
  $("s2").onclick=function(){
    var t=summaryText(),b=$("s2");
    function ok(){b.textContent="Copied ✓"}
    function old(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
      try{document.execCommand("copy");ok()}catch(e){alert("Could not copy. Press and hold the text to copy it.")}document.body.removeChild(a)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,old);else old()};

  // Coming back via a "Back" / "Save Stock" link skips the password once; a fresh open or a refresh always asks.
  if(sessionStorage.getItem("menuok")==="1"){sessionStorage.removeItem("menuok");route();return}
  $("gate").onsubmit=function(e){
    e.preventDefault();
    sha($("gp").value).then(function(x){
      if(x===HASH){$("gp").value="";route()}else $("ge").textContent="Wrong password"})};
})();
</script>
</body>
</html>
