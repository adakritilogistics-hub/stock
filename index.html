<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock</title>
<style>
:root{--desk:#d9dde0;--paper:#fbfaf7;--ink:#1d2a33;--muted:#66727a;--line:#dfdcd3;--accent:#1f5f7a}
@media (prefers-color-scheme:dark){:root{--desk:#14191d;--paper:#222a30;--ink:#eef1f3;--muted:#9aa6ad;--line:#38434b;--accent:#6bb7d4}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--desk);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
.box{width:100%;max-width:380px}
h1{margin:0 0 6px;font-size:30px;text-align:center}
.lead{margin:0 0 24px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.list a{display:block;padding:20px 22px;border-radius:12px;background:var(--paper);color:var(--ink);text-decoration:none;
  font-size:20px;font-weight:600;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.list a:active{transform:scale(.98)}
.list a:focus-visible,#gate input:focus-visible,#gate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gate form{background:var(--paper);padding:28px;border-radius:12px;text-align:center;border:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.18)}
#gate input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--desk);color:var(--ink);font-size:16px;margin:14px 0 10px}
#gate button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#gate p{color:#b3402a;font-size:14px;margin:10px 0 0;min-height:18px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="box">
  <div id="gate">
    <form id="gf">
      <h1>Stock</h1>
      <input id="gp" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
      <button type="submit">Open</button>
      <p id="ge"></p>
    </form>
  </div>
  <div id="menu" hidden>
    <h1>What do you want to see?</h1>
    <p class="lead">Choose a stock list</p>
    <div class="list">
      <a href="mats.html" onclick="sessionStorage.setItem('go','1')">Mats</a>
      <a href="runners.html" onclick="sessionStorage.setItem('go','1')">Runners</a>
      <a href="multidesigns.html" onclick="sessionStorage.setItem('go','1')">MultiDesigns</a>
    </div>
  </div>
</div>
<script>
(function(){
  var HASH="d350d79a2e8b1aab1652684cfe09fa8a85909512bde545cb2bb364a1296a3830"; // password: phistock
  function show(){document.getElementById("gate").hidden=true;document.getElementById("menu").hidden=false}
  function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
  try{localStorage.removeItem("matpw")}catch(e){}
  // Coming back via the "Menu" link skips the password once; a fresh open or a refresh always asks.
  if(sessionStorage.getItem("menuok")==="1"){sessionStorage.removeItem("menuok");show();return}
  document.getElementById("gf").onsubmit=function(e){
    e.preventDefault();
    sha(document.getElementById("gp").value).then(function(h){
      if(h===HASH)show(); else document.getElementById("ge").textContent="Wrong password"})};
})();
</script>
</body>
</html>
